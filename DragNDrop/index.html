<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Area Educación a Distacia - Min. de Educación GCABA">
    <meta name="description" content="Material didáctico adicional.">
    <link rel="stylesheet" href="./css/estilos.css">
    <link rel="stylesheet" href="./css/cuestionario.css">
    <link rel="stylesheet" href="./css/dragndrop.css">
    <title>Educación a Distancia - AHPF</title>
</head>
<body id="captura" class="colorFondo2">
    <div id="contenedor" class="colorFondo4">
        
        <!-- Membrete superior -->
        <div id="membsup">
            <img class="membrete" src="./img/membreteHeader.jpg" alt="Membrete Ministerio de Educación GCABA">
        </div>

        <!-- Contenido del documento -->
        <div id="contenido" class="colorTexto2">
            <header>
                <div class="divHeader">
                    <h1>Asignatura o Curso</h1>
                    <img src="./img/ImagenOpcional.png" alt="Imagen opcional" class="imgCabecera">
                </div>
            </header>
            <main>
                <section>
                    <div class="cabSection">
                        <i><img src="./img/arrastrar-y-soltar.png" alt="Icono de arrastrar y soltar"></i>
                        <h2>Arrastrar y soltar</h2>
                    </div>
                    <h3>Coonsigna</h3>
                    <p>Descripción de la actividad.</p>
                    <div id="contenidoDinamico">

                    </div>
                </section>
            </main>
            <div id="botonera">
                <button id="reintentar" class="boton colorFondo1">Reintentar</button>
            </div>
        </div>
        
    </div>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
